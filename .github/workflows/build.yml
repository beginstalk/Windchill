---
name: DeploymentByType
on:
  push:
    branches:
      - feature/Deployment_Type
    
jobs:
  deployment-initializer:
   runs-on: self-hosted
   outputs:
    executeBackup: ${{ steps.set-outputs.outputs.executeBackup }}
    buildType: ${{ steps.set-outputs.outputs.buildType }}
    executeRestoreDatabase: ${{ steps.set-outputs.outputs.executeRestoreDatabase }}
    executeRestoreWindchill: ${{ steps.set-outputs.outputs.executeRestoreWindchill }}
    windchillBackupId: ${{ steps.set-outputs.outputs.windchillBackupId }}
    databaseBackupId: ${{ steps.set-outputs.outputs.databaseBackupId }}
   steps:
    - name: set the output
      id: set-outputs
      run: | 
       echo "::set-output name=executeBackup::false"
       echo "::set-output name=buildType::xyx"
       echo "::set-output name=executeRestoreDatabase::false"
       echo "::set-output name=executeRestoreWindchill::true"
       echo "::set-output name=windchillBackupId::2024-07-08_09-03"
       echo "::set-output name=databaseBackupId::2024-07-08_09-03"

  create-backup:
   needs: deployment-initializer
   if: ${{ needs.deployment-initializer.outputs.executeBackup == 'true' }}
   uses: ./.github/workflows/create-backup.yml
  
  restore-database:
   needs: deployment-initializer
   if: ${{ needs.deployment-initializer.outputs.executeRestoreDatabase == 'true' }}
   uses: ./.github/workflows/restore-database.yml
   with:
     backup-id: ${{needs.deployment-initializer.outputs.databaseBackupId}}
  
  restore-windchill:
   needs: deployment-initializer
   if: ${{ needs.deployment-initializer.outputs.executeRestoreWindchill == 'true' }}
   uses: ./.github/workflows/restore-windchill.yml
   with:
     backup-id: ${{needs.deployment-initializer.outputs.windchillBackupId}}
   
  incremental-build:
    needs: deployment-initializer
    if: ${{ needs.deployment-initializer.outputs.buildType == 'incremental'}}
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 
      
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - uses: s4u/maven-settings-action@v3.0.0
        with:
         servers: '[{"id": "artifactory-repo", "username": "admin", "password": "Admin123"}]'

      - name: Cache SonarQube packages
        uses: actions/cache@v1
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v1
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - uses: jitterbit/get-changed-files@v1
        id: abc
        with: 
          format: space-delimited
          token: ${{secrets.ACCESS_GITHUB_TOKEN}}

      - name: import Modified Load Files
        env:
          MODIFIED_FILES: ${{steps.abc.outputs.added_modified}}
        run: |
          cd scripts
          ./importloadfiles.bat

      - name: Windchill Build
        env:
          WINDCHILL_URL: ${{ secrets.WINDCHILL_URL }}
          WINDCHILL_USERNAME: ${{ secrets.WINDCHILL_USERNAME }}
          WINDCHILL_PASSWORD: ${{ secrets.WINDCHILL_PASSWORD }}
        run: |
          cd scripts
          ./windchillBuild.bat


  full-build:
    needs: deployment-initializer
    if: ${{ needs.deployment-initializer.outputs.buildType == 'full'}}
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 
      
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - uses: s4u/maven-settings-action@v3.0.0
        with:
         servers: '[{"id": "artifactory-repo", "username": "admin", "password": "Admin123"}]'

      - name: Cache SonarQube packages
        uses: actions/cache@v1
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v1
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - uses: jitterbit/get-changed-files@v1
        id: abc
        with: 
          format: space-delimited
          token: ${{secrets.ACCESS_GITHUB_TOKEN}}

      - name: import All the Load Files
        env:
          MODIFIED_FILES: ${{steps.abc.outputs.all}}
        run: |
          cd scripts
          ./importloadfiles.bat

      - name: Windchill Build
        env:
          WINDCHILL_URL: ${{ secrets.WINDCHILL_URL }}
          WINDCHILL_USERNAME: ${{ secrets.WINDCHILL_USERNAME }}
          WINDCHILL_PASSWORD: ${{ secrets.WINDCHILL_PASSWORD }}
        run: |
          cd scripts
          ./windchillBuild.bat
      



      

      
     
