name: create-backup
on:
  workflow_call:
jobs:
  database-backup:
    runs-on: self-hosted
    steps:
    - name: Database Backup
      run: |
        $curr_date = GET-DATE -format yyyy-MM-dd_HH:mm
        sqlcmd -S TWX\WINDCHILL -Q "BACKUP DATABASE wcdbadmin TO DISK='C:\Backup\DB\${curr_date}.bak' WITH INIT"
  
  windchill-backup:
     runs-on: self-hosted
     steps:
     - name: Windchill Codebase Backup
       run: |
        $curr_date = GET-DATE -format yyyy-MM-dd_HH:mm
        xcopy /y/i/s "C:\\ptc\\Windchill_12.1\\Windchill\\codebase" "C:\\Backup\\Codebase\\${curr_date}"