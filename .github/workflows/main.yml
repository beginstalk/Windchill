name: Ant Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: sonarqube analaysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      uses: sonarsource/sonarqube-scan-action@v1
      # run: mvn sonar:sonar -D"sonar.projectKey"="test-project" -D"sonar.projectName"='test project'

    # - name: Build with Ant
    #   run: ant
