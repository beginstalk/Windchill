name: WindchillDevopsBuild
on:
  push:
    branches:
      - main # the name of your main branch
  pull_request:
    types: [opened, synchronize]
jobs:
  build:
    name: Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: Cache SonarQube packages
        uses: actions/cache@v1
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v1
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
      - uses: jitterbit/get-changed-files@v1
        id: abc
        with: 
          format: space-delimited
          token: ${{secrets.ACCESS_GITHUB_TOKEN}}
        name: printing
        run: |
            echo "All:"
            echo "${{ steps.abc.outputs.all }}"
            echo "Added:"
            echo "${{ steps.abc.outputs.added }}"
            echo "Removed:"
            echo "${{ steps.abc.outputs.removed }}"
            echo "Renamed:"
            echo "${{ steps.abc.outputs.renamed }}"
            echo "Modified:"
            echo "${{ steps.abc.outputs.modified }}"
            echo "Added+Modified:"
            echo "${{ steps.abc.outputs.added_modified }}"
      - name: Load file into Windchill
        env:
          WINDCHILL_URL: ${{ secrets.WINDCHILL_URL }}
          WINDCHILL_USERNAME: ${{ secrets.WINDCHILL_USERNAME }}
          WINDCHILL_PASSWORD: ${{ secrets.WINDCHILL_PASSWORD }}
